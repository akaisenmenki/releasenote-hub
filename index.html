<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Release Note Hub - 公開されたリリース情報の一覧">
    <title>Release Note Hub</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f5f7fa;
        --surface: #ffffff;
        --text: #172033;
        --muted: #667085;
        --border: #dfe4ec;
        --accent: #1f5eff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      header, main {
        width: min(880px, calc(100% - 32px));
        margin-inline: auto;
      }

      header { padding: 64px 0 32px; }
      h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.5rem); }
      header p, #status { margin: 0; color: var(--muted); }

      .release-list {
        display: grid;
        gap: 16px;
        padding: 24px 0 64px;
      }

      article {
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 8px 24px rgb(23 32 51 / 6%);
      }

      .metadata {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .category {
        padding: 1px 10px;
        border-radius: 999px;
        background: #e9efff;
        color: #1746b0;
        font-weight: 600;
      }

      h2 { margin: 0 0 8px; font-size: 1.35rem; }
      article > p { margin: 0; }
      details { margin-top: 16px; }
      summary { color: var(--accent); cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Release Note Hub</h1>
      <p>サービスの新機能・改善・修正情報をお知らせします。</p>
    </header>

    <main>
      <p id="status" role="status">リリース情報を読み込んでいます。</p>
      <div id="releases" class="release-list" aria-live="polite"></div>
    </main>

    <script>
      const apiUrl =
        "https://script.google.com/macros/s/AKfycbzUtWl3OLZj7WKZOch82Z5WyUiYmUMTukH1cNcUH8SphhCOR07TGGskUQsugGmegAUQyA/exec";

      const status = document.getElementById("status");
      const container = document.getElementById("releases");

      function appendTextElement(parent, tagName, text, className) {
        const element = document.createElement(tagName);
        element.textContent = text;
        if (className) element.className = className;
        parent.appendChild(element);
        return element;
      }

      function renderRelease(release) {
        const article = document.createElement("article");
        const metadata = document.createElement("p");
        metadata.className = "metadata";

        appendTextElement(metadata, "time", release.releaseDate || "日付未設定");
        appendTextElement(metadata, "span", release.category || "Other", "category");
        article.appendChild(metadata);

        appendTextElement(article, "h2", release.title || "タイトル未設定");
        appendTextElement(article, "p", release.summary || "概要はありません。");

        if (release.detail) {
          const details = document.createElement("details");
          appendTextElement(details, "summary", "詳細を見る");
          appendTextElement(details, "p", release.detail);
          article.appendChild(details);
        }

        container.appendChild(article);
      }

      fetch(apiUrl)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => {
          if (!Array.isArray(data)) throw new Error("Unexpected response format");
          status.textContent = data.length
            ? `${data.length}件のリリース情報`
            : "公開中のリリース情報はありません。";
          data.forEach(renderRelease);
        })
        .catch(error => {
          status.textContent =
            "リリース情報を取得できませんでした。時間をおいて再度お試しください。";
          console.error("Failed to load release notes:", error);
        });
    </script>
  </body>
</html>
